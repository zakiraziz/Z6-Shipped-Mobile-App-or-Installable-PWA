<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Beep splash source</title>
    <!--
      Source of the iOS launch screens (#10). Rendered headless at each
      device size:
        chrome --headless --force-device-scale-factor=1 \
               --window-size=W,H --screenshot=public/splash/splash-WxH.png tools/splash.html
      Dark background on purpose — the default white splash is the tell.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 3.5vmin;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      svg {
        width: 26vmin;
        height: 26vmin;
      }
      h1 {
        margin: 0;
        color: #f1f5f9;
        font-size: 8vmin;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 3.2vmin;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect x="44" y="11" width="12" height="6" rx="3" fill="#a3e635" />
        <rect x="47" y="15" width="6" height="6" fill="#a3e635" />
        <circle cx="50" cy="55" r="24" fill="none" stroke="#a3e635" stroke-width="6" />
        <line x1="50" y1="55" x2="50" y2="39" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
        <line x1="50" y1="55" x2="62" y2="62" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
        <circle cx="50" cy="55" r="3" fill="#e2e8f0" />
      </svg>
      <h1>Beep</h1>
      <p>offline interval timer</p>
    </div>
  </body>
</html>
