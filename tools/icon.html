<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Beep icon source</title>
    <!--
      Source of the PNG app icons. Rendered headless at
      192x192 / 512x512 / 180x180 with:
        chrome --headless --force-device-scale-factor=1 \
               --window-size=W,W --screenshot=out.png tools/icon.html
      The glyph stays inside the maskable safe zone (circle r=40 centred),
      so the same artwork works for "any" and "maskable" purposes.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#020617" />
      <rect x="44" y="11" width="12" height="6" rx="3" fill="#a3e635" />
      <rect x="47" y="15" width="6" height="6" fill="#a3e635" />
      <circle cx="50" cy="55" r="24" fill="none" stroke="#a3e635" stroke-width="6" />
      <line x1="50" y1="55" x2="50" y2="39" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <line x1="50" y1="55" x2="62" y2="62" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
      <circle cx="50" cy="55" r="3" fill="#e2e8f0" />
    </svg>
  </body>
</html>
