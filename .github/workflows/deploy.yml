name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The claim "0 unbacked claims" is itself a claim. Nothing enforced it
      # before this step, so a new README bullet could ship with no check at
      # all. This runs first and fails fast — before the slow browser suite.
      - name: Audit README feature claims against the smoke checks
        run: npm run test:claims
      # Checksums BEFORE tests: tests must never mutate release output. The
      # restore-in-finally in scripts/smoke.mjs protects local runs; this gate
      # makes any future mutation bug block the deploy instead of shipping.
      # (git diff can't be used: dist/ is gitignored.)
      - name: Record pristine dist checksums
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
      # Round 4: the old gate covered dist/ only, so a test that mutated
      # public/sw.js or src/ would ship unchallenged. Hash the build INPUTS too.
      - name: Record pristine build-input checksums
        run: |
          find src public -type f -print0 | sort -z | xargs -0 sha256sum > inputs.sha256
          sha256sum index.html package.json vite.config.ts tsconfig.json tailwind.config.js postcss.config.js >> inputs.sha256
      # Block the deploy if the end-to-end + offline smoke test fails.
      - run: npm run test:smoke
      - name: Assert dist is pristine (tests must not modify build output)
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.after.sha256
          if ! diff -u dist.sha256 dist.after.sha256; then
            echo "::error::dist/ was modified by tests — refusing to deploy"
            exit 1
          fi
      - name: Assert build inputs are pristine (src/, public/, config)
        run: |
          find src public -type f -print0 | sort -z | xargs -0 sha256sum > inputs.after.sha256
          sha256sum index.html package.json vite.config.ts tsconfig.json tailwind.config.js postcss.config.js >> inputs.after.sha256
          if ! diff -u inputs.sha256 inputs.after.sha256; then
            echo "::error::build inputs were modified by tests — refusing to deploy"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
